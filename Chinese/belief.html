                天生我材必有用，何须浮议乱心胸。人生自古多磨折，一时失意亦从容。
            </p>

            <p>
                人生不如意事十之八九。人生在世，难免经历挫折与失败。可失败并不可怕—可怕的是自暴自弃，不再相信自己。想当年李白被赐金返还，亦是写出了《将进酒》，写出了可贵的自我肯定和不屈。我相信上帝既让我们来到这个世上，赐予我们如此才能，那边不会让我们一世无成。相信自己！一时失利，何足挂齿。
            </p>

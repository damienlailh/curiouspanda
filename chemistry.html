<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry | CuriousPanda</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <!-- Navigation bar -->
    <div id="navbar"></div>

    <main class="container article-collection" data-article-collection>
        <header class="article-header">
            <h1 class="page-title">Chemistry</h1>
        </header>

        <section class="article-content">
            <p>Explore chemistry through notes, explanations, and reflections.</p>
        </section>

        <!-- Reuse these controls and articleCollection.js on other section pages.
             Each card's article-theme badge defines its preset theme. -->
        <div class="collection-controls" data-collection-controls hidden>
            <label for="article-search">Search articles</label>
            <input id="article-search" type="search" data-article-search
                placeholder="Search by title, keyword, or theme..." aria-controls="article-results">
            <p class="collection-filter-help" id="theme-filter-help">Select themes to narrow your search. Articles must match every selected theme.</p>
            <div class="theme-filters" data-theme-filters role="group" aria-label="Filter by themes" aria-describedby="theme-filter-help"></div>
            <p class="collection-status" data-collection-status role="status" aria-live="polite" aria-atomic="true"></p>
        </div>

        <div class="article-grid" id="article-results">
            <!-- Add article cards here; their badges provide the theme filters. -->
        </div>
        <p class="collection-empty" data-collection-empty hidden>No articles yet. Check back soon.</p>
    </main>
    <div id="footer"></div>
    <!-- Link to JavaScript -->
    <script src="/articleCollection.js" defer></script>
    <script src="/loadNav.js"></script>
    <script src="/loadFooter.js"></script>
</body>
</html>
